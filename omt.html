<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Assetto Corsa Drift OMT Banner (One More Time)</title>
  <link rel="stylesheet" href="omt.css">
</head>
<body>

  <div class="omt-stage" id="omtStage">
    <!-- Outer Shockwave Ring -->
    <div class="omt-shockwave" id="omtShockwave"></div>

    <!-- Slanted Drift Plate -->
    <div class="omt-card" id="omtCard">
      <!-- Light streak shine sweep -->
      <div class="omt-shine"></div>

      <!-- Counter-skewed inner content -->
      <div class="omt-card-inner">
        
        <!-- Top line: Badges -->
        <div class="omt-top-line">
          <span class="omt-badge left">JUDGES DECISION</span>
          <span class="omt-icon">&#9889;</span>
          <span class="omt-badge right">&#1057;&#1059;&#1044;&#1045;&#1049;&#1057;&#1050;&#1054;&#1045; &#1056;&#1045;&#1068;&#1045;&#1053;&#1048;&#1045;</span>
        </div>

        <!-- Center Hero: Wings + OMT -->
        <div class="omt-hero">
          <div class="omt-wing left-wing">
            <span class="wing-bar"></span>
            <span class="wing-bar"></span>
            <span class="wing-bar"></span>
          </div>

          <div class="omt-title-box">
            <span class="omt-letters">OMT</span>
          </div>

          <div class="omt-wing right-wing">
            <span class="wing-bar"></span>
            <span class="wing-bar"></span>
            <span class="wing-bar"></span>
          </div>
        </div>

        <!-- Subtitle: ONE MORE TIME -->
        <div class="omt-subtitle">
          <span class="omt-sub-text">ONE MORE TIME</span>
        </div>

        <!-- Bottom line: Russian Translation & Battle Roles -->
        <div class="omt-bottom-line">
          <span class="omt-role-pill lead">&#1051;&#1048;&#1044;&#1045;&#1056;</span>
          <span class="omt-ru-tag">&#9876; &#1055;&#1045;&#1056;&#1045;&#1047;&#1040;&#1045;&#1047;&#1044; &#9876;</span>
          <span class="omt-role-pill chase">&#1063;&#1045;&#1049;&#1047;</span>
        </div>

        <!-- 5-Second Countdown Timer Progress Bar -->
        <div class="omt-timer-bar">
          <div class="omt-timer-progress" id="omtTimerProgress"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Configuration & URL Query Parameters
    var params = new URLSearchParams(window.location.search);
    var isTestMode = params.has('test') || params.has('preview');
    // Default display duration is 5 seconds if not overridden via URL ?duration=X or ?autohide=X
    var autoHideSeconds = parseInt(params.get('duration') || params.get('autohide') || 5, 10);
    var enableSound = params.has('sound');

    var omtStage = document.getElementById('omtStage');
    var omtCard = document.getElementById('omtCard');
    var omtTimerProgress = document.getElementById('omtTimerProgress');

    // Strict state management to guarantee ZERO FLICKER
    var isCurrentlyShowing = false;
    var isVisible = false;
    var autoHideTimer = null;
    var dismissTimer = null;
    var cooldownUntil = 0;

    // Independent tracking for different data sources so they never conflict
    var lastGameOmtActive = false;
    var lastDirectorOmtActive = false;

    // Optional synthesized cinematic impact sound (pure Web Audio API, no files needed)
    function playImpactSound() {
      if (!enableSound) return;
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(34, ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.55);
      } catch (e) {}
    }

    // Triggers the 5-second OMT appearance with full protection against flicker
    function triggerEntrance(customDuration) {
      if (!omtStage || !omtCard) return;

      // 1. Anti-flicker guard: if currently showing and active on screen, IGNORE duplicate calls!
      if (isCurrentlyShowing) {
        return;
      }

      // 2. Cooldown guard: prevent immediately re-triggering from lingering packets
      if (Date.now() < cooldownUntil && !isTestMode) {
        return;
      }

      var duration = customDuration || autoHideSeconds || 5;

      isCurrentlyShowing = true;
      isVisible = true;

      // Clear any pending timers
      if (autoHideTimer) clearTimeout(autoHideTimer);
      if (dismissTimer) clearTimeout(dismissTimer);

      omtStage.classList.remove('is-hidden');
      omtCard.classList.remove('is-dismissing');
      
      // Start CSS entrance animation smoothly
      omtCard.style.animation = 'none';
      void omtCard.offsetWidth; // single reflow to start animation cleanly
      omtCard.style.animation = '';

      // Start countdown timer progress bar (5s)
      if (omtTimerProgress) {
        omtTimerProgress.style.animation = 'none';
        void omtTimerProgress.offsetWidth;
        omtTimerProgress.style.animation = 'omtTimerCountdown ' + duration + 's linear forwards';
      }

      playImpactSound();

      // Automatically dismiss after the duration (5 seconds)
      if (duration > 0 && !isTestMode && !params.has('always')) {
        autoHideTimer = setTimeout(function() {
          hideOmt();
        }, duration * 1000);
      }
    }

    // Dismiss animation
    function hideOmt() {
      if (!isCurrentlyShowing && !isVisible) return;
      if (!omtCard) return;

      if (autoHideTimer) {
        clearTimeout(autoHideTimer);
        autoHideTimer = null;
      }

      isCurrentlyShowing = false;
      // Set cooldown for 1.2s to prevent bouncing
      cooldownUntil = Date.now() + 1200;

      omtCard.classList.add('is-dismissing');

      dismissTimer = setTimeout(function() {
        if (!isCurrentlyShowing) {
          if (omtStage) omtStage.classList.add('is-hidden');
          isVisible = false;
        }
      }, 480);
    }

    // Director / Web Panel event handler
    function handleDirectorOmt(isActive) {
      var active = !!isActive;
      if (active && !lastDirectorOmtActive) {
        triggerEntrance(5);
      }
      lastDirectorOmtActive = active;
    }

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        var directorBus = new BroadcastChannel('ac_obs_director_bus');
        directorBus.onmessage = function(ev) {
          if (ev && ev.data && typeof ev.data.omtActive !== 'undefined') {
            handleDirectorOmt(ev.data.omtActive);
          }
        };
      } catch(e) {}
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'AC_OBS_DIRECTOR_STATE' && e.newValue) {
        try {
          var s = JSON.parse(e.newValue);
          if (s && typeof s.omtActive !== 'undefined') handleDirectorOmt(s.omtActive);
        } catch(err) {}
      }
    });

    // Fast poller for OBS director OMT state in top32.json (independent from game poller)
    function pollOmtDirectorState() {
      fetch('top32.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) {
          if (d && d.obs_director && typeof d.obs_director.omtActive !== 'undefined') {
            handleDirectorOmt(d.obs_director.omtActive);
          }
        })
        .catch(function() {});
    }
    setInterval(pollOmtDirectorState, 500);

    // Interactive controls: click or Space/Enter to trigger/replay
    document.addEventListener('click', function() {
      if (isCurrentlyShowing) {
        // Allow click to hide if already showing
        hideOmt();
      } else {
        triggerEntrance();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === ' ' || e.key === 'Enter') {
        if (isCurrentlyShowing) {
          hideOmt();
        } else {
          triggerEntrance();
        }
      }
    });

    // If not in test/preview mode, initially start hidden
    if (!isTestMode && !params.has('always')) {
      if (omtStage) omtStage.classList.add('is-hidden');
      isVisible = false;
      isCurrentlyShowing = false;
    } else {
      // In test or preview mode, show immediately
      triggerEntrance();
    }

    // Live poller for Assetto Corsa drivers.json
    var isPolling = false;
    function pollOmtData() {
      if (isPolling) return;
      isPolling = true;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'drivers.json?nocache=' + Date.now(), true);
      xhr.timeout = 250;

      xhr.onload = function() {
        isPolling = false;
        if (xhr.status === 200 || xhr.status === 0) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data) {
              handleData(data);
              return;
            }
          } catch(e) {}
        }
        pollScriptFallback();
      };

      xhr.onerror = function() {
        isPolling = false;
        pollScriptFallback();
      };

      xhr.ontimeout = function() {
        isPolling = false;
        pollScriptFallback();
      };

      try {
        xhr.send();
      } catch (e) {
        isPolling = false;
        pollScriptFallback();
      }
    }

    var scriptPending = false;
    function pollScriptFallback() {
      if (scriptPending) return;
      scriptPending = true;

      var old = document.getElementById('data-script');
      if (old) old.remove();

      var script = document.createElement('script');
      script.id = 'data-script';
      script.src = 'drivers_data.js?nocache=' + Date.now();

      script.onload = function() {
        scriptPending = false;
        if (window.AC_OBS_DATA) {
          handleData(window.AC_OBS_DATA);
        }
      };

      script.onerror = function() {
        scriptPending = false;
      };

      document.body.appendChild(script);
    }

    function handleData(data) {
      if (isTestMode || params.has('always')) return;

      var gameActive = false;
      var duration = autoHideSeconds || 5;

      if (data.omt) {
        gameActive = !!data.omt.active;
        if (data.omt.duration) duration = data.omt.duration;
      } else if (data.battle && data.battle.omt) {
        gameActive = !!data.battle.omt.active;
      }

      // Trigger entrance strictly on false -> true edge transition
      if (gameActive && !lastGameOmtActive) {
        triggerEntrance(duration);
      }

      lastGameOmtActive = gameActive;
    }

    // Single master polling interval for game data (200ms)
    setInterval(pollOmtData, 200);
    pollOmtData();
  </script>
</body>
</html>
