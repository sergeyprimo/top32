  <script>
    // Configuration via URL parameters:
    // ?theme=cyan | dual | fire | magenta
    // ?pos=center | bottom-left | bottom-right | top-left | top-right | top-center | bottom-center
    var params = new URLSearchParams(window.location.search);
    var currentTheme = params.get('theme') || 'cyan';
    var currentPos = params.get('pos') || 'center';

    function applyConfig() {
      document.body.className = '';
      document.body.classList.add('theme-' + currentTheme);
      if (currentPos !== 'center') {
        document.body.classList.add('pos-' + currentPos);
      }
    }

    var themes = ['cyan', 'dual', 'fire', 'magenta'];
    function cycleTheme() {
      var idx = themes.indexOf(currentTheme);
      currentTheme = themes[(idx + 1) % themes.length];
      applyConfig();
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === '1') { currentTheme = 'cyan'; applyConfig(); }
      if (e.key === '2') { currentTheme = 'dual'; applyConfig(); }
      if (e.key === '3') { currentTheme = 'fire'; applyConfig(); }
      if (e.key === '4') { currentTheme = 'magenta'; applyConfig(); }
    });

    applyConfig();
  </script>
