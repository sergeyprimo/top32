<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Assetto Corsa Drift Battle HUD</title>
  <link rel="stylesheet" href="battle.css">
</head>
<body>

  <div class="battle-container" id="battleContainer">
    <!-- LEAD PLATE -->
    <div class="pilot-plate lead" id="leadPlate">
      <div class="pilot-plate-inner">
        <div class="pilot-left">
          <div class="role-badge">
            <span class="role-title">LEAD</span>
            <span class="role-sub">&#1051;&#1048;&#1044;&#1045;&#1056;</span>
          </div>
          <div class="pilot-identity">
            <div class="name-line">
              <span class="pilot-name" id="leadName">PILOT</span>
              <span class="you-pill" id="leadYou" style="display:none;">&#1042;&#1067;</span>
              <span class="status-pill pit" id="leadStatus">
                <span class="status-dot"></span>
                <span class="status-text">&#1042; &#1055;&#1048;&#1058;&#1040;&#1061;</span>
              </span>
            </div>
            <div class="sub-meta-line">
              <span class="pilot-car" id="leadCar">DRIFT CAR</span>
              <span class="progress-pill" id="leadProgress" style="display:none;">0%</span>
            </div>
          </div>
        </div>

        <div class="pilot-telemetry">
          <div class="telemetry-block">
            <span class="speed-value" id="leadSpeed">0</span>
            <span class="speed-unit">&#1050;&#1052;/&#1063;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER VS BADGE -->
    <div class="vs-divider">
      <span class="vs-text">VS</span>
    </div>

    <!-- CHASE PLATE -->
    <div class="pilot-plate chase" id="chasePlate">
      <div class="pilot-plate-inner">
        <div class="pilot-left">
          <div class="role-badge">
            <span class="role-title">CHASE</span>
            <span class="role-sub">&#1063;&#1045;&#1049;&#1047;</span>
          </div>
          <div class="pilot-identity">
            <div class="name-line">
              <span class="pilot-name" id="chaseName">&#1054;&#1046;&#1048;&#1044;&#1040;&#1053;&#1048;&#1045; &#1057;&#1054;&#105F;&#1045;&#1056;&#1053;&#1048;&#1050;&#1040;...</span>
              <span class="you-pill" id="chaseYou" style="display:none;">&#1042;&#1067;</span>
              <span class="status-pill pit" id="chaseStatus">
                <span class="status-dot"></span>
                <span class="status-text">&#1054;&#1046;&#1048;&#1044;&#1040;&#1053;&#1048;&#1045;</span>
              </span>
            </div>
            <div class="sub-meta-line">
              <span class="pilot-car" id="chaseCar">&#1055;&#1054;&#1044;&#1050;&#1051;&#1070;&#1067;&#1048;&#1058;&#1045;&#1057;&#1068; &#1050; &#1055;&#1040;&#1056;&#1045;</span>
              <span class="progress-pill" id="chaseProgress" style="display:none;">0%</span>
            </div>
          </div>
        </div>

        <div class="pilot-telemetry">
          <div class="telemetry-block">
            <span class="speed-value" id="chaseSpeed">0</span>
            <span class="speed-unit">&#1050;&#1052;/&#1063;</span>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script>
    // Parse URL params for OBS configuration (clean borders, scale, pos)
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('clean') === '1' || urlParams.get('shadow') === '0' || urlParams.get('obs') === '1') {
      document.body.classList.add('clean-style');
    }
    var scaleParam = urlParams.get('scale');
    if (scaleParam) {
      if (scaleParam === '0.75' || scaleParam === '75') document.body.classList.add('scale-75');
      else if (scaleParam === '0.85' || scaleParam === '85') document.body.classList.add('scale-85');
      else if (scaleParam === '1.15' || scaleParam === '115') document.body.classList.add('scale-115');
      else if (scaleParam === '1.25' || scaleParam === '125') document.body.classList.add('scale-125');
    }
    var posParam = urlParams.get('pos');
    if (posParam === 'bottom') document.body.classList.add('pos-bottom');
    else if (posParam === 'top') document.body.classList.add('pos-top');

    // Live synchronization with OBS Director Controller
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        var directorBus = new BroadcastChannel('ac_obs_director_bus');
        directorBus.onmessage = function(ev) {
          if (ev && ev.data) {
            var s = ev.data;
            if (s.cleanBorder) document.body.classList.add('clean-style');
            else document.body.classList.remove('clean-style');

            if (s.heroPos === 'bottom') {
              document.body.classList.remove('pos-top');
              document.body.classList.add('pos-bottom');
            } else if (s.heroPos === 'top') {
              document.body.classList.remove('pos-bottom');
              document.body.classList.add('pos-top');
            }

            document.body.classList.remove('scale-75', 'scale-85', 'scale-115', 'scale-125');
            if (s.scale && s.scale !== 100) {
              document.body.classList.add('scale-' + s.scale);
            }
          }
        };
      } catch(e) {}
    }

    // High-performance Live Tournament Data listener and poller for OBS
    var tourneyActivePair = null;

    function applyTournamentPairData(data) {
      if (!data) return;
      if (data.obs_director) {
        var s = data.obs_director;
        if (s.cleanBorder) document.body.classList.add('clean-style');
        else document.body.classList.remove('clean-style');
        if (s.heroPos === 'bottom') {
          document.body.classList.remove('pos-top');
          document.body.classList.add('pos-bottom');
        } else if (s.heroPos === 'top') {
          document.body.classList.remove('pos-bottom');
          document.body.classList.add('pos-top');
        }
        document.body.classList.remove('scale-75', 'scale-85', 'scale-115', 'scale-125');
        if (s.scale && s.scale !== 100) {
          document.body.classList.add('scale-' + s.scale);
        }
      }
      if (data.battles && Array.isArray(data.battles)) {
        var activeB = null;
        data.battles.forEach(function(b) {
          if (b.status === 'live' || b.status === 'omt') activeB = b;
        });
        if (!activeB && data.battles[0]) activeB = data.battles[0];
        if (activeB) {
          var d1 = activeB.lead || { name: activeB.driver1, car: activeB.car1 };
          var d2 = activeB.chase || { name: activeB.driver2, car: activeB.car2 };
          tourneyActivePair = {
            lead: { name: d1.name || activeB.driver1 || 'PILOT 1', car: d1.car || activeB.car1 || 'DRIFT CAR', status_code: activeB.status === 'omt' ? 'omt' : 'track' },
            chase: { name: d2.name || activeB.driver2 || 'PILOT 2', car: d2.car || activeB.car2 || 'DRIFT CAR', status_code: activeB.status === 'omt' ? 'omt' : 'track' }
          };
          if (typeof renderBattle === 'function' && window.AC_OBS_DATA) {
            renderBattle(window.AC_OBS_DATA.battle, window.AC_OBS_DATA.drivers);
          }
        }
      }
    }

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        var top32Bus = new BroadcastChannel('ac_top32_bus');
        top32Bus.onmessage = function(ev) {
          if (ev && ev.data) applyTournamentPairData(ev.data);
        };
      } catch(e) {}
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'AC_TOP32_DATA' && e.newValue) {
        try { applyTournamentPairData(JSON.parse(e.newValue)); } catch(err) {}
      }
    });

    try {
      var savedTop32 = localStorage.getItem('AC_TOP32_DATA');
      if (savedTop32) applyTournamentPairData(JSON.parse(savedTop32));
    } catch(e) {}

    // Active live poller for tournament data in OBS
    var battleTop32Etag = null;
    var isBattleTop32Fetching = false;
    function pollBattleTournamentLive() {
      if (isBattleTop32Fetching) return;
      isBattleTop32Fetching = true;
      var isGithubHost = (window.location.hostname && window.location.hostname.indexOf('github.io') !== -1);

      if (isGithubHost) {
        var headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (battleTop32Etag) headers['If-None-Match'] = battleTop32Etag;
        fetch('https://api.github.com/repos/sergeyprimo/top32/contents/top32.json', { headers: headers, cache: 'no-store' })
          .then(function(res) {
            if (res.status === 304) return null;
            if (res.ok) {
              var et = res.headers.get('ETag');
              if (et) battleTop32Etag = et;
              return res.json();
            }
          })
          .then(function(meta) {
            if (meta && meta.content) {
              var binStr = atob(meta.content.replace(/\s/g, ''));
              var bytes = new Uint8Array(binStr.length);
              for (var i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
              var decoded = new TextDecoder('utf-8').decode(bytes);
              applyTournamentPairData(JSON.parse(decoded));
            }
          })
          .catch(function() {})
          .finally(function() { isBattleTop32Fetching = false; });
      } else {
        fetch('top32.json?nocache=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) { if (data) applyTournamentPairData(data); })
          .catch(function() {})
          .finally(function() { isBattleTop32Fetching = false; });
      }
    }
    setInterval(pollBattleTournamentLive, 750);
    pollBattleTournamentLive();

    // Unicode-safe status dictionary
    var STATUS_MAP = {
      "track": "\u0412 \u0417\u0410\u0415\u0417\u0414\u0415",
      "ready": "\u041D\u0410 \u0421\u0422\u0410\u0420\u0422\u0415",
      "finish": "\u0424\u0418\u041D\u0418\u0428",
      "pit": "\u0412 \u041F\u0418\u0422\u0410\u0425",
      "transit": "\u0414\u041E \u0421\u0422\u0410\u0420\u0422\u0410"
    };

    function renderPilot(plateEl, nameEl, youEl, statusEl, carEl, progEl, speedEl, pilot) {
      if (!pilot || !plateEl) return;
      plateEl.style.display = 'flex';

      // Streamer highlight
      if (pilot.is_player) {
        plateEl.classList.add('is-player');
        if (youEl) youEl.style.display = 'inline-block';
      } else {
        plateEl.classList.remove('is-player');
        if (youEl) youEl.style.display = 'none';
      }

      if (nameEl) nameEl.textContent = (pilot.name || 'PILOT').toUpperCase();
      if (carEl) carEl.textContent = (pilot.car || 'DRIFT CAR').toUpperCase();
      if (speedEl) speedEl.textContent = (pilot.speed !== undefined && pilot.speed !== null) ? pilot.speed : 0;

      // Status handling
      var statusCode = pilot.status_code || "track";
      var statusText = pilot.status || STATUS_MAP[statusCode] || "\u0412 \u0417\u0410\u0415\u0417\u0414\u0415";

      if (statusEl) {
        statusEl.className = "status-pill " + statusCode;
        var textSpan = statusEl.querySelector('.status-text');
        if (textSpan) {
          textSpan.textContent = statusText;
        }
      }

      // Progress along drift section
      if (progEl) {
        if (pilot.progress_pct && pilot.progress_pct > 0 && statusCode === 'track') {
          progEl.style.display = 'inline-block';
          progEl.textContent = pilot.progress_pct + "%";
        } else {
          progEl.style.display = 'none';
        }
      }
    }

    function renderBattle(battleData, allDrivers) {
      try {
        var leadPlate = document.getElementById('leadPlate');
        var chasePlate = document.getElementById('chasePlate');

        var leadName = document.getElementById('leadName');
        var leadYou = document.getElementById('leadYou');
        var leadStatus = document.getElementById('leadStatus');
        var leadCar = document.getElementById('leadCar');
        var leadProgress = document.getElementById('leadProgress');
        var leadSpeed = document.getElementById('leadSpeed');

        var chaseName = document.getElementById('chaseName');
        var chaseYou = document.getElementById('chaseYou');
        var chaseStatus = document.getElementById('chaseStatus');
        var chaseCar = document.getElementById('chaseCar');
        var chaseProgress = document.getElementById('chaseProgress');
        var chaseSpeed = document.getElementById('chaseSpeed');

        var lead = null;
        var chase = null;

        if (battleData && battleData.lead) {
          lead = battleData.lead;
          chase = battleData.chase;
        } else if (allDrivers && allDrivers.length > 0) {
          lead = allDrivers[0];
          if (allDrivers.length >= 2) {
            chase = allDrivers[1];
          }
        } else if (tourneyActivePair) {
          lead = tourneyActivePair.lead;
          chase = tourneyActivePair.chase;
        }

        // Render LEAD
        if (lead) {
          renderPilot(leadPlate, leadName, leadYou, leadStatus, leadCar, leadProgress, leadSpeed, lead);
        }

        // Render CHASE
        if (chase) {
          renderPilot(chasePlate, chaseName, chaseYou, chaseStatus, chaseCar, chaseProgress, chaseSpeed, chase);
        } else {
          // Solo mode: Keep CHASE plate as waiting placeholder
          if (chasePlate) {
            chasePlate.style.display = 'flex';
            chasePlate.classList.remove('is-player');
          }
          if (chaseName) chaseName.textContent = "\u041E\u0416\u0418\u0414\u0410\u041D\u0418\u0415 \u0421\u041E\u041F\u0415\u0426\u041D\u0418\u041A\u0410...";
          if (chaseYou) chaseYou.style.display = 'none';
          if (chaseStatus) {
            chaseStatus.className = "status-pill pit";
            var stText = chaseStatus.querySelector('.status-text');
            if (stText) stText.textContent = "\u041E\u0416\u0418\u0414\u0410\u041D\u0418\u0415";
          }
          if (chaseCar) chaseCar.textContent = "\u041F\u041E\u0414\u041A\u041B\u042E\u0427\u0418\u0422\u0415\u0421\u042C \u041A \u041F\u0410\u0420\u0415";
          if (chaseProgress) chaseProgress.style.display = 'none';
        }
      } catch (err) {
        console.error("renderBattle error:", err);
      }
    }

    // High-performance live poller (XHR to drivers.json + script tag fallback)
    var isPolling = false;

    function pollData() {
      if (isPolling) return;
      isPolling = true;

      // 1. Primary: XMLHttpRequest to drivers.json
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'drivers.json?nocache=' + Date.now(), true);
      xhr.timeout = 250;

      xhr.onload = function() {
        isPolling = false;
        if (xhr.status === 200 || xhr.status === 0) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data) {
              renderBattle(data.battle, data.drivers);
              return;
            }
          } catch(e) {}
        }
        pollScriptFallback();
      };

      xhr.onerror = function() {
        isPolling = false;
        pollScriptFallback();
      };

      xhr.ontimeout = function() {
        isPolling = false;
        pollScriptFallback();
      };

      try {
        xhr.send();
      } catch (e) {
        isPolling = false;
        pollScriptFallback();
      }
    }

    var scriptTagPending = false;
    function pollScriptFallback() {
      if (scriptTagPending) return;
      scriptTagPending = true;

      var old = document.getElementById('data-script');
      if (old) old.remove();

      var script = document.createElement('script');
      script.id = 'data-script';
      script.src = 'drivers_data.js?nocache=' + Date.now();

      script.onload = function() {
        scriptTagPending = false;
        if (window.AC_OBS_DATA) {
          renderBattle(window.AC_OBS_DATA.battle, window.AC_OBS_DATA.drivers);
        }
      };

      script.onerror = function() {
        scriptTagPending = false;
      };

      document.head.appendChild(script);
    }

    // Run poll every 150ms (almost 7 updates/sec)
    pollData();
    setInterval(pollData, 150);
  </script>
</body>
</html>
