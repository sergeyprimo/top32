<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Assetto Corsa Drift Battle HUD</title>
  <link rel="stylesheet" href="battle.css">
  <script src="drivers_data.js"></script>
</head>
<body>

  <div class="battle-container" id="battleContainer">
    <!-- LEAD PLATE -->
    <div class="pilot-plate lead" id="leadPlate">
      <div class="pilot-plate-inner">
        <div class="pilot-left">
          <div class="role-badge">
            <span class="role-title">LEAD</span>
            <span class="role-sub">ЛИДЕР</span>
          </div>
          <div class="pilot-identity">
            <div class="name-line">
              <span class="pilot-name" id="leadName">ОЖИДАЕМ ПИЛОТА...</span>
              <span class="you-pill" id="leadYou" style="display:none;">ВЫ</span>
              <span class="status-pill waiting" id="leadStatus">
                <span class="status-dot"></span>
                <span class="status-text">ОЖИДАНИЕ</span>
              </span>
            </div>
            <div class="sub-meta-line">
              <span class="pilot-car" id="leadCar">ОЖИДАНИЕ В БОКСАХ</span>
              <span class="progress-pill" id="leadProgress" style="display:none;">0%</span>
            </div>
          </div>
        </div>

        <div class="pilot-telemetry">
          <div class="telemetry-block">
            <span class="speed-value" id="leadSpeed">0</span>
            <span class="speed-unit">КМ/Ч</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER VS BADGE -->
    <div class="vs-divider">
      <span class="vs-text">VS</span>
    </div>

    <!-- CHASE PLATE -->
    <div class="pilot-plate chase" id="chasePlate">
      <div class="pilot-plate-inner">
        <div class="pilot-left">
          <div class="role-badge">
            <span class="role-title">CHASE</span>
            <span class="role-sub">ЧЕЙЗ</span>
          </div>
          <div class="pilot-identity">
            <div class="name-line">
              <span class="pilot-name" id="chaseName">ОЖИДАНИЕ СОПЕРНИКА...</span>
              <span class="you-pill" id="chaseYou" style="display:none;">ВЫ</span>
              <span class="status-pill pit" id="chaseStatus">
                <span class="status-dot"></span>
                <span class="status-text">ОЖИДАНИЕ</span>
              </span>
            </div>
            <div class="sub-meta-line">
              <span class="pilot-car" id="chaseCar">ПОДКЛЮЧИТЕСЬ К ПАРЕ</span>
              <span class="progress-pill" id="chaseProgress" style="display:none;">0%</span>
            </div>
          </div>
        </div>

        <div class="pilot-telemetry">
          <div class="telemetry-block">
            <span class="speed-value" id="chaseSpeed">0</span>
            <span class="speed-unit">КМ/Ч</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__DRIFT_BATTLE_V2__ = true;
    // URL parameters for OBS customization (scale, position, borders)
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('clean') === '1' || urlParams.get('shadow') === '0' || urlParams.get('obs') === '1') {
      document.body.classList.add('clean-style');
    }
    var scaleParam = urlParams.get('scale');
    if (scaleParam) {
      if (scaleParam === '0.75' || scaleParam === '75') document.body.classList.add('scale-75');
      else if (scaleParam === '0.85' || scaleParam === '85') document.body.classList.add('scale-85');
      else if (scaleParam === '1.15' || scaleParam === '115') document.body.classList.add('scale-115');
      else if (scaleParam === '1.25' || scaleParam === '125') document.body.classList.add('scale-125');
    }
    var posParam = urlParams.get('pos');
    if (posParam === 'bottom') document.body.classList.add('pos-bottom');
    else if (posParam === 'top') document.body.classList.add('pos-top');

    // Live OBS Director Controller listener (if used)
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        var directorBus = new BroadcastChannel('ac_obs_director_bus');
        directorBus.onmessage = function(ev) {
          if (ev && ev.data) {
            var s = ev.data;
            if (s.cleanBorder) document.body.classList.add('clean-style');
            else document.body.classList.remove('clean-style');

            if (s.heroPos === 'bottom') {
              document.body.classList.remove('pos-top');
              document.body.classList.add('pos-bottom');
            } else if (s.heroPos === 'top') {
              document.body.classList.remove('pos-bottom');
              document.body.classList.add('pos-top');
            }

            document.body.classList.remove('scale-75', 'scale-85', 'scale-115', 'scale-125');
            if (s.scale && s.scale !== 100) {
              document.body.classList.add('scale-' + s.scale);
            }
          }
        };
      } catch(e) {}
    }

    // Status dictionary
    var STATUS_MAP = {
      "ready": "НА СТАРТЕ",
      "track": "В ЗАЕЗДЕ",
      "finish": "ФИНИШ",
      "transit": "ПОДЪЕЗД",
      "pit": "В ПИТАХ"
    };

    function renderPilot(plateEl, nameEl, youEl, statusEl, carEl, progEl, speedEl, pilot, role) {
      if (!plateEl) return;
      plateEl.style.display = 'flex';

      var isPreview = false;
      try {
        var params = new URLSearchParams(window.location.search);
        isPreview = (params.get('preview') === '1' || params.get('always_names') === '1');
      } catch(e) {}

      // Preview fallback if requested via URL
      if (isPreview && (!pilot || pilot.status_code === 'pit')) {
        if (role === 'chase') {
          pilot = { name: "CHASE PILOT", car: "DRIFT CAR 2JZ", speed: 104, status_code: "track", status: "В ЗАЕЗДЕ", progress_pct: 62, is_player: false };
        } else {
          pilot = { name: "LEAD PILOT", car: "DRIFT CAR V8", speed: 110, status_code: "track", status: "В ЗАЕЗДЕ", progress_pct: 65, is_player: false };
        }
      }

      // Empty or waiting pilot or pilot sitting in pits
      var isPitOrWaiting = !pilot || !pilot.name || pilot.name === 'ОЖИДАНИЕ ПИЛОТА' || pilot.name === '---' ||
                           pilot.status_code === 'pit' || pilot.in_pit === true ||
                           pilot.status === 'В ПИТАХ' || (pilot.status_text && pilot.status_text.indexOf('ПИТ') !== -1) ||
                           (pilot.speed === 0 && pilot.status_code !== 'ready' && pilot.status_code !== 'track');

      if (isPitOrWaiting) {
        plateEl.classList.add('is-waiting');
        plateEl.classList.remove('is-player');
        if (youEl) youEl.style.display = 'none';

        if (nameEl) {
          nameEl.classList.add('waiting-pilot');
          nameEl.textContent = (role === 'lead') ? "ОЖИДАЕМ ПИЛОТА..." : "ОЖИДАНИЕ СОПЕРНИКА...";
        }

        if (carEl) {
          carEl.textContent = (role === 'lead') ? "ОЖИДАНИЕ В БОКСАХ" : "ПОДКЛЮЧИТЕСЬ К ПАРЕ";
        }

        if (speedEl) speedEl.textContent = 0;

        if (statusEl) {
          statusEl.className = "status-pill waiting";
          var textSpan = statusEl.querySelector('.status-text');
          if (textSpan) textSpan.textContent = "ОЖИДАНИЕ";
        }

        if (progEl) progEl.style.display = 'none';
        return;
      }

      // Active Pilot from Assetto Corsa session
      var statusCode = pilot.status_code || "pit";
      var isAtAction = (statusCode === 'ready' || statusCode === 'track' || statusCode === 'finish');

      if (isAtAction) {
        plateEl.classList.remove('is-waiting');
      } else {
        plateEl.classList.add('is-waiting');
      }

      if (nameEl) {
        nameEl.classList.remove('waiting-pilot');
        nameEl.textContent = pilot.name.toUpperCase();
      }

      // Streamer / player indicator
      if (pilot.is_player) {
        plateEl.classList.add('is-player');
        if (youEl) youEl.style.display = 'inline-block';
      } else {
        plateEl.classList.remove('is-player');
        if (youEl) youEl.style.display = 'none';
      }

      if (carEl) {
        carEl.textContent = (pilot.car || 'DRIFT CAR').toUpperCase();
      }

      if (speedEl) {
        speedEl.textContent = (pilot.speed !== undefined && pilot.speed !== null) ? pilot.speed : 0;
      }

      var statusText = pilot.status || (STATUS_MAP[statusCode] || "В ЗАЕЗДЕ");
      if (statusEl) {
        statusEl.className = "status-pill " + statusCode;
        var textSpan = statusEl.querySelector('.status-text');
        if (textSpan) textSpan.textContent = statusText;
      }

      // Live progress along drift section
      if (progEl) {
        if (pilot.progress_pct && pilot.progress_pct > 0 && statusCode === 'track') {
          progEl.style.display = 'inline-block';
          progEl.textContent = pilot.progress_pct + "%";
        } else {
          progEl.style.display = 'none';
        }
      }
    }

    function renderBattle(battleData, allDrivers) {
      try {
        var leadPlate = document.getElementById('leadPlate');
        var chasePlate = document.getElementById('chasePlate');

        var leadName = document.getElementById('leadName');
        var leadYou = document.getElementById('leadYou');
        var leadStatus = document.getElementById('leadStatus');
        var leadCar = document.getElementById('leadCar');
        var leadProgress = document.getElementById('leadProgress');
        var leadSpeed = document.getElementById('leadSpeed');

        var chaseName = document.getElementById('chaseName');
        var chaseYou = document.getElementById('chaseYou');
        var chaseStatus = document.getElementById('chaseStatus');
        var chaseCar = document.getElementById('chaseCar');
        var chaseProgress = document.getElementById('chaseProgress');
        var chaseSpeed = document.getElementById('chaseSpeed');

        var lead = null;
        var chase = null;

        var isRealActivePilot = function(p) {
          if (!p || !p.name || p.name === 'ОЖИДАНИЕ ПИЛОТА' || p.name === '---') return false;
          if (p.in_pit || p.status_code === 'pit' || p.status === 'В ПИТАХ') return false;
          if (p.status_text && p.status_text.indexOf('ПИТ') !== -1) return false;
          if (p.speed === 0 && p.status_code !== 'ready' && p.status_code !== 'track') return false;
          return (p.status_code === 'track' || p.status_code === 'ready' || p.status_code === 'finish');
        };

        // Pure live battle data from Assetto Corsa server
        if (battleData && battleData.active && isRealActivePilot(battleData.lead)) {
          lead = battleData.lead;
          chase = isRealActivePilot(battleData.chase) ? battleData.chase : null;
        } else if (allDrivers && allDrivers.length > 0) {
          // Fallback only if cars are actively on track / near start
          var onTrackActive = allDrivers.filter(isRealActivePilot);
          if (onTrackActive.length >= 2) {
            lead = onTrackActive[0];
            chase = onTrackActive[1];
          } else if (onTrackActive.length === 1) {
            lead = onTrackActive[0];
            chase = null;
          } else {
            lead = null;
            chase = null;
          }
        } else {
          lead = null;
          chase = null;
        }

        // Render LEAD
        renderPilot(leadPlate, leadName, leadYou, leadStatus, leadCar, leadProgress, leadSpeed, lead, 'lead');

        // Render CHASE
        renderPilot(chasePlate, chaseName, chaseYou, chaseStatus, chaseCar, chaseProgress, chaseSpeed, chase, 'chase');
      } catch (err) {
        console.error("renderBattle error:", err);
      }
    }

    // High-performance real-time telemetry poller (Direct script injection for OBS Studio file://)
    var isFileProtocol = (window.location.protocol === 'file:');
    var isPolling = false;

    function pollLiveTelemetry() {
      if (isFileProtocol) {
        // Direct zero-latency dynamic script injection to bypass local CORS in OBS
        var old = document.getElementById('data-script');
        if (old) old.remove();

        var script = document.createElement('script');
        script.id = 'data-script';
        script.src = 'drivers_data.js?nocache=' + Date.now();
        script.onload = function() {
          if (window.AC_OBS_DATA) {
            renderBattle(window.AC_OBS_DATA.battle, window.AC_OBS_DATA.drivers);
          }
        };
        document.head.appendChild(script);
        return;
      }

      // For HTTP / Localhost web server
      if (isPolling) return;
      isPolling = true;

      var dataUrl = 'drivers.json?nocache=' + Date.now();
      fetch(dataUrl, { cache: 'no-store' })
        .then(function(res) {
          if (!res.ok) throw new Error('status ' + res.status);
          return res.json();
        })
        .then(function(data) {
          isPolling = false;
          if (data) {
            window.AC_OBS_DATA = data;
            renderBattle(data.battle, data.drivers);
          }
        })
        .catch(function() {
          isPolling = false;
          // Dynamic script fallback if fetch fails
          var old = document.getElementById('data-script');
          if (old) old.remove();
          var script = document.createElement('script');
          script.id = 'data-script';
          script.src = 'drivers_data.js?nocache=' + Date.now();
          script.onload = function() {
            if (window.AC_OBS_DATA) {
              renderBattle(window.AC_OBS_DATA.battle, window.AC_OBS_DATA.drivers);
            }
          };
          document.head.appendChild(script);
        });
    }

    // Immediate instant bootstrap from pre-loaded script
    if (window.AC_OBS_DATA) {
      renderBattle(window.AC_OBS_DATA.battle, window.AC_OBS_DATA.drivers);
    }

    // High frequency 50ms poll (20 updates/sec for smooth live speed and instant start/finish response)
    pollLiveTelemetry();
    setInterval(pollLiveTelemetry, 50);
  </script>
</body>
</html>
