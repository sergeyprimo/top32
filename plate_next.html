<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Plate: Up Next Card (Следующий заезд)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent !important;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      user-select: none;
      padding: 40px;
    }
    body.pos-left { justify-content: flex-start; }

    .next-card {
      background: linear-gradient(135deg, rgba(13, 17, 24, 0.96) 0%, rgba(22, 28, 38, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      width: 320px;
      transform: skewX(-8deg);
      transition: all 0.3s ease;
    }
    body.clean-style .next-card { box-shadow: none !important; }

    .next-inner {
      transform: skewX(8deg);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .next-badge {
      font-size: 9px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .next-title {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }
    .next-cars {
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
    }
    .next-timer-box {
      margin-top: 6px;
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid #0284c7;
      padding: 2px 8px;
      border-radius: 4px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="next-card">
    <div class="next-inner">
      <div class="next-badge" id="nextHitNum">СЛЕДУЮЩИЙ ЗАЕЗД • ХИТ #5</div>
      <div class="next-title" id="nextPairTitle">ИСТРАТИЙ ⚔ АДАМОВИЧ</div>
      <div class="next-cars" id="nextCarsTitle">NISSAN SILVIA S15 ⚡ MERCEDES E63</div>
      <span class="next-timer-box" id="nextTimerBadge">⏱️ Готовность к старту</span>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pPos = params.get('pos') || 'bottom-right';
    var pClean = (params.get('clean') === '1' || params.get('obs') === '1');

    if (pPos.indexOf('left') !== -1) document.body.classList.add('pos-left');
    if (pClean) document.body.classList.add('clean-style');

    function renderNext(data) {
      if (!data) return;
      var stage = data.stage_mode || data.stage || 'top32';
      var list = (stage === 'top16') ? data.battles_top16 : (data.battles || []);
      var activeId = data.active_battle_id;

      var currentIdx = list.findIndex(function(b) { return Number(b.id) === Number(activeId); });
      var nextBattle = null;
      if (currentIdx !== -1 && list[currentIdx + 1]) {
        nextBattle = list[currentIdx + 1];
      } else if (list.length > 1) {
        nextBattle = list[1];
      }

      if (nextBattle) {
        document.getElementById('nextHitNum').textContent = 'СЛЕДУЮЩИЙ ЗАЕЗД • ХИТ #' + (nextBattle.pair_num || 2);
        var lName = (nextBattle.lead && nextBattle.lead.name) ? nextBattle.lead.name : 'ЛИДЕР';
        var cName = (nextBattle.chase && nextBattle.chase.name) ? nextBattle.chase.name : 'ЧЕЙЗЕР';
        document.getElementById('nextPairTitle').textContent = lName.toUpperCase() + ' ⚔ ' + cName.toUpperCase();

        var lCar = (nextBattle.lead && nextBattle.lead.car) ? nextBattle.lead.car : 'CAR 1';
        var cCar = (nextBattle.chase && nextBattle.chase.car) ? nextBattle.chase.car : 'CAR 2';
        document.getElementById('nextCarsTitle').textContent = lCar.toUpperCase() + ' ⚡ ' + cCar.toUpperCase();
      }
    }

    function pollNext() {
      fetch('top32.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(renderNext)
        .catch(function() {});
    }

    pollNext();
    setInterval(pollNext, 1500);
  </script>
</body>
</html>
