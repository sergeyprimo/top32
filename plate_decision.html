<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Plate: Judges Decision & OMT Alert (Вердикт)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent !important;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .decision-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .decision-card {
      background: linear-gradient(135deg, rgba(13, 17, 24, 0.98) 0%, rgba(22, 28, 38, 0.98) 100%);
      border: 2px solid #f59e0b;
      border-left: 10px solid #f59e0b;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(245, 158, 11, 0.35);
      padding: 24px 36px;
      transform: skewX(-8deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      animation: alertPopup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .decision-card.winner-lead {
      border-color: #0284c7;
      border-left-color: #38bdf8;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.35);
    }
    .decision-card.winner-chase {
      border-color: #be123c;
      border-left-color: #fb7185;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(251, 113, 133, 0.35);
    }

    @keyframes alertPopup {
      0% { opacity: 0; transform: skewX(-8deg) scale(0.8); }
      100% { opacity: 1; transform: skewX(-8deg) scale(1); }
    }

    .decision-inner {
      transform: skewX(8deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .badge-top {
      background: #f59e0b;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .decision-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
      line-height: 1.1;
    }
    .decision-sub {
      font-size: 15px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vote-item {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="decision-wrapper" id="decisionBox" style="display:none;">
    <div class="decision-card" id="decisionCard">
      <div class="decision-inner">
        <span class="badge-top" id="badgeTop">⚡ ВЕРДИКТ СУДЕЙСТВА ⚡</span>
        <div class="decision-title" id="decisionTitle">ONE MORE TIME (OMT)</div>
        <div class="decision-sub" id="decisionSub">
          <span class="vote-item" id="vote1">С1: OMT</span>
          <span class="vote-item" id="vote2">С2: LEAD</span>
          <span class="vote-item" id="vote3">С3: OMT</span>
          <span style="color:#f59e0b; margin-left:8px;" id="decisionNote">ПЕРЕЗАЕЗД ПАРЫ</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pDur = parseInt(params.get('duration') || '5', 10);
    var isPreview = (params.get('preview') === '1');

    var hideTimer = null;

    function showAlert(title, badge, v1, v2, v3, note, type) {
      var box = document.getElementById('decisionBox');
      var card = document.getElementById('decisionCard');
      card.className = 'decision-card' + (type ? (' ' + type) : '');

      document.getElementById('decisionTitle').textContent = title;
      document.getElementById('badgeTop').textContent = badge;
      document.getElementById('vote1').textContent = v1;
      document.getElementById('vote2').textContent = v2;
      document.getElementById('vote3').textContent = v3;
      document.getElementById('decisionNote').textContent = note;

      box.style.display = 'flex';

      if (hideTimer) clearTimeout(hideTimer);
      if (pDur > 0) {
        hideTimer = setTimeout(function() {
          box.style.display = 'none';
        }, pDur * 1000);
      }
    }

    if (isPreview) {
      showAlert('ONE MORE TIME (OMT)', '⚡ ВЕРДИКТ СУДЕЙСТВА ⚡', 'С1: OMT', 'С2: LEAD', 'С3: OMT', 'ПЕРЕЗАЕЗД ПАРЫ', 'winner-omt');
    }

    // BroadcastChannel listener
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        var bus = new BroadcastChannel('ac_obs_director_bus');
        bus.onmessage = function(ev) {
          if (!ev || !ev.data) return;
          if (ev.data.omtActive) {
            showAlert('ONE MORE TIME (OMT)', '⚡ ВЕРДИКТ СУДЕЙСТВА ⚡', 'С1: OMT', 'С2: OMT', 'С3: OMT', 'ПЕРЕЗАЕЗД ПАРЫ', 'winner-omt');
          }
        };
      } catch(e) {}
    }

    // Poller for top32.json decisions
    var lastWinnerHit = null;
    function pollDecision() {
      fetch('top32.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data) return;
          if (data.obs_director && data.obs_director.omtActive) {
            showAlert('ONE MORE TIME (OMT)', '⚡ ВЕРДИКТ СУДЕЙСТВА ⚡', 'С1: OMT', 'С2: OMT', 'С3: OMT', 'ПЕРЕЗАЕЗД ПАРЫ', 'winner-omt');
            return;
          }

          var activeId = data.active_battle_id;
          if (activeId !== undefined && data.battles) {
            var b = data.battles.find(function(x) { return Number(x.id) === Number(activeId); });
            if (b && b.winner && lastWinnerHit !== (b.id + '_' + b.winner)) {
              lastWinnerHit = (b.id + '_' + b.winner);
              var wName = (b.winner === 'lead' ? b.lead.name : b.chase.name) || 'ПИЛОТ';
              var votes = b.judges || [];
              var v1 = 'С1: ' + (votes[0] ? votes[0].vote.toUpperCase() : '-');
              var v2 = 'С2: ' + (votes[1] ? votes[1].vote.toUpperCase() : '-');
              var v3 = 'С3: ' + (votes[2] ? votes[2].vote.toUpperCase() : '-');
              showAlert('ПОБЕДИТЕЛЬ: ' + wName.toUpperCase(), '🏆 РЕШЕНИЕ СУДЕЙ 🏆', v1, v2, v3, 'ВЫХОД В СЛЕДУЮЩИЙ РАУНД', b.winner === 'lead' ? 'winner-lead' : 'winner-chase');
            }
          }
        })
        .catch(function() {});
    }

    setInterval(pollDecision, 1000);
  </script>
</body>
</html>
